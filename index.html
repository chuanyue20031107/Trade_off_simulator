<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affective AI Pro Dashboard</title>
    <style>
        :root {
            --bg-color: #050A18;
            --card-bg: rgba(255, 255, 255, 0.05);
            --primary-blue: #00D2FF;
            --accent-gold: #D4AF37;
            --danger-red: #FF4757;
            --text-main: #E0E6ED;
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; transition: all 0.5s ease; }
        
        /* 红光闪烁预警动画 */
        @keyframes alert-glow {
            0% { box-shadow: inset 0 0 50px rgba(255,71,87,0); }
            50% { box-shadow: inset 0 0 150px rgba(255,71,87,0.3); background-color: rgba(255,71,87,0.05); }
            100% { box-shadow: inset 0 0 50px rgba(255,71,87,0); }
        }
        body.alert-active { animation: alert-glow 1.5s infinite; }

        .container { max-width: 900px; width: 100%; }
        h1 { text-align: center; color: #FFF; text-transform: uppercase; letter-spacing: 3px; border-bottom: 2px solid var(--accent-gold); padding-bottom: 10px; margin-bottom: 30px; }

        /* 顶部仪表盘布局 */
        .dashboard-header { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .gauge-card { background: var(--card-bg); border-radius: 15px; padding: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .gauge-svg { width: 120px; height: 120px; transform: rotate(-90deg); }
        .gauge-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
        .gauge-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray 0.6s ease, stroke 0.6s ease; }
        .gauge-value { font-size: 1.8rem; font-weight: bold; margin-top: -85px; margin-bottom: 40px; display: block; }
        .gauge-label { font-size: 0.9rem; color: #8898AA; }

        /* 传感器卡片布局 */
        .sensor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 25px; }
        .sensor-card { 
            background: rgba(255,255,255,0.08); 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 关键：变暗效果的 CSS */
        .sensor-card.dimmed {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.02);
            filter: grayscale(0.8) brightness(0.4);
            opacity: 0.5;
            transform: scale(0.98);
        }

        .sensor-info { display: flex; align-items: center; gap: 12px; }
        .sensor-icon { width: 30px; height: 30px; fill: var(--primary-blue); transition: fill 0.4s; }
        .dimmed .sensor-icon { fill: #555; }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-blue); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* 人群选择卡片 */
        .demo-card { background: var(--card-bg); border-radius: 15px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); }
        select { width: 100%; padding: 15px; background: #000; color: #FFF; border: 1px solid #444; border-radius: 8px; font-size: 1rem; outline: none; }
        
        #warning-msg { display: none; margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; border-left: 5px solid; align-items: center; gap: 10px; }
        .warning-shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body id="main-body">

<div class="container">
    <h1>Affective AI Ethics Simulator</h1>

    <div class="dashboard-header">
        <div class="gauge-card">
            <svg class="gauge-svg">
                <circle class="gauge-bg" cx="60" cy="60" r="50"></circle>
                <circle id="acc-gauge" class="gauge-fill" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="31.4"></circle>
            </svg>
            <span id="acc-val" class="gauge-value">90%</span>
            <span class="gauge-label">SYSTEM ACCURACY</span>
        </div>
        <div class="gauge-card">
            <svg class="gauge-svg">
                <circle class="gauge-bg" cx="60" cy="60" r="50"></circle>
                <circle id="com-gauge" class="gauge-fill" cx="60" cy="60" r="50" stroke-dasharray="314" stroke-dashoffset="251.2"></circle>
            </svg>
            <span id="com-val" class="gauge-value">20%</span>
            <span class="gauge-label">COMFORT & PRIVACY</span>
        </div>
    </div>

    <div class="sensor-grid">
        <div class="sensor-card" id="card-chest">
            <div class="sensor-info">
                <svg class="sensor-icon" viewBox="0 0 24 24"><path d="M12,2C10.9,2 10,2.9 10,4V6H7C5.9,6 5,6.9 5,8V11H2V13H5V16C5,17.1 5.9,18 7,18H10V20C10,21.1 10.9,22 12,22C13.1,22 14,21.1 14,20V18H17C18.1,18 19,17.1 19,16V13H22V11H19V8C19,6.9 18.1,6 17,6H14V4C14,2.9 13.1,2 12,2Z"/></svg>
                <span>Chest EDA</span>
            </div>
            <label class="switch"><input type="checkbox" id="check-chest" checked onchange="update()"><span class="slider"></span></label>
        </div>
        <div class="sensor-card" id="card-ecg">
            <div class="sensor-info">
                <svg class="sensor-icon" viewBox="0 0 24 24"><path d="M17,17H7V10L12,6L17,10V17M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2"/></svg>
                <span>ECG Patch</span>
            </div>
            <label class="switch"><input type="checkbox" id="check-ecg" checked onchange="update()"><span class="slider"></span></label>
        </div>
        <div class="sensor-card" id="card-emg">
            <div class="sensor-info">
                <svg class="sensor-icon" viewBox="0 0 24 24"><path d="M12,10A3,3 0 0,1 15,13A3,3 0 0,1 12,16A3,3 0 0,1 9,13A3,3 0 0,1 12,10"/></svg>
                <span>EMG Face</span>
            </div>
            <label class="switch"><input type="checkbox" id="check-emg" checked onchange="update()"><span class="slider"></span></label>
        </div>
        <div class="sensor-card" id="card-wrist">
            <div class="sensor-info">
                <svg class="sensor-icon" viewBox="0 0 24 24"><path d="M17.11 3.99C17.68 5.64 18 7.37 18 9.17S17.68 12.69 17.11 14.34"/></svg>
                <span>Wrist Unit</span>
            </div>
            <label class="switch"><input type="checkbox" id="check-wrist" checked onchange="update()"><span class="slider"></span></label>
        </div>
    </div>

    <div class="demo-card">
        <h2>Demographic Stress Test</h2>
        <select id="select-demo" onchange="update()">
            <option value="base">25-35 yrs European (Base Group)</option>
            <option value="elderly">65+ yrs Asian Elderly</option>
            <option value="teen">15 yrs Mediterranean Teen</option>
        </select>
        <div id="warning-msg"></div>
    </div>
</div>

<script>
    function update() {
        const chest = document.getElementById('check-chest').checked;
        const ecg = document.getElementById('check-ecg').checked;
        const emg = document.getElementById('check-emg').checked;
        const wrist = document.getElementById('check-wrist').checked;
        const demo = document.getElementById('select-demo').value;

        // 处理卡片变暗逻辑 (The "Dim" effect)
        toggleDim('card-chest', chest);
        toggleDim('card-ecg', ecg);
        toggleDim('card-emg', emg);
        toggleDim('card-wrist', wrist);

        // 计算逻辑
        let accuracy = 0;
        let comfort = 100;

        if(chest) { accuracy += 45; comfort -= 30; }
        if(ecg) { accuracy += 30; comfort -= 25; }
        if(wrist) { accuracy += 14; comfort -= 10; }
        if(emg) { accuracy += 1; comfort -= 15; }

        let finalAcc = accuracy;
        const msg = document.getElementById('warning-msg');
        const body = document.getElementById('main-body');
        msg.style.display = 'none';
        body.classList.remove('alert-active');

        if(demo === 'elderly') {
            finalAcc = Math.round(accuracy * 0.6);
            showMsg("🚨 ETHICAL RISK: Baseline mismatch; high risk of False Negatives!", "#DC3545");
            body.classList.add('alert-active');
        } else if(demo === 'teen') {
            finalAcc = Math.round(accuracy * 0.8);
            showMsg("⚠️ WARNING: High baseline arousal; high risk of False Positives!", "#FFC107");
        } else {
            showMsg("✅ STATUS: Normal. No demographic bias detected.", "#28A745");
            msg.style.display = 'flex';
        }

        // 更新仪表盘 (Circular Gauge Updates)
        updateGauge('acc-gauge', 'acc-val', finalAcc, finalAcc < 70 ? '#FF4757' : '#00D2FF');
        updateGauge('com-gauge', 'com-val', comfort, '#D4AF37');
    }

    function toggleDim(id, active) {
        const el = document.getElementById(id);
        if(!active) el.classList.add('dimmed');
        else el.classList.remove('dimmed');
    }

    function updateGauge(id, textId, val, color) {
        const circle = document.getElementById(id);
        const offset = 314 - (314 * val / 100);
        circle.style.strokeDashoffset = offset;
        circle.style.stroke = color;
        document.getElementById(textId).innerText = val + '%';
        document.getElementById(textId).style.color = color;
    }

    function showMsg(txt, color) {
        const msg = document.getElementById('warning-msg');
        msg.style.display = 'flex';
        msg.innerText = txt;
        msg.style.borderColor = color;
        msg.style.color = color;
        msg.style.backgroundColor = color + '22';
        msg.classList.add('warning-shake');
        setTimeout(() => msg.classList.remove('warning-shake'), 500);
    }

    function updateSim() { update(); } // 别名兼容
    update(); // 初始化
</script>

</body>
</html>
